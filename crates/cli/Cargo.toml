[package]
name = "openjewelcad-cli"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lightweight Open Jewel CAD primitive editor"

[[bin]]
name = "openjewelcad"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
openjewelcad-cad-ffi = { path = "../cad-ffi" }
openjewelcad-geometry = { path = "../geometry" }
rfd = { version = "0.18", default-features = false, features = ["common-controls-v6"] }
